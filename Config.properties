allowedDomainTooltip = Eine Domain eingeben, z. B. aachener-grund.de. Ein fuehrendes @ ist erlaubt. Subdomains sind nicht automatisch erlaubt. Eine leere oder ungueltige Einstellung sperrt die Registrierung. Die Regel gilt fuer alle Shops, die dieses Plugin-Set verwenden.
